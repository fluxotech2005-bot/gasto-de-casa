<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f7d57">
  <title>Gastos da Casa</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>🏠 Gastos da Casa</h1>

    <div class="card">
      <div class="mut">Total do mês</div>
      <div class="total" id="total">R$ 0,00</div>
      <select id="mes"></select>
    </div>

    <div class="card">
      <input id="desc" placeholder="O que foi? (ex.: mercado)">
      <div class="row">
        <input id="valor" type="number" inputmode="decimal" step="0.01" placeholder="Valor (R$)">
        <input id="data" type="date">
      </div>
      <select id="cat">
        <option>🛒 Mercado</option>
        <option>💡 Contas</option>
        <option>💧 Água</option>
        <option>🍽️ Mistura</option>
        <option>🚌 Transporte</option>
        <option>💊 Saúde</option>
      </select>
      <button id="add">Adicionar gasto</button>
    </div>

    <div class="card" id="lista"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
